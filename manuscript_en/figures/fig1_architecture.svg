  <rect x="24" y="384" width="1052" height="84" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="44" y="411" class="btitle" fill="#0f766e">100% Data Sovereignty + $0.00 Cloud API Cost + Full Cryptographic Provenance</text>
  <text x="44" y="433" class="btxt">No unpublished manuscripts or queries leave local hardware; 86.3% of L4 VRAM (~81% of 16 GB T4) remains free for larger quantized models.</text>
