  <text x="295" y="440" class="lbl" fill="#065f46">UCAI Sovereign Box achieves F1 = 0.9184 (45:3 wins vs BM25, exact McNemar p &lt; 10⁻⁸) at $0.00.</text>
  <text x="58" y="460" class="lbl" fill="#065f46">Stacking Qwen2.5-1.5B-Instruct on the same GPU consumes only 3,086.07 MB VRAM (13.68% of L4) at 229.2 ms/item.</text>
